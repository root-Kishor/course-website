ictive Analytics",def:"Tells what will happen in future. Uses past data to train model.",example:"Next month sales will be 12 lakhs.",keyword:"Future Prediction"},{icon:"\uD83E\uDDED",heading:"Prescriptive Analytics",def:"Tells what action to take. Gives best decision suggestion.",example:"Give 10% discount to increase sales.",keyword:"What To Do"},{icon:"\uD83D\uDEE0️",heading:"Tools",def:"Common tools are Python, R, SQL, Excel, Tableau. Python most popular.",example:"Python does analysis in 10 lines.",keyword:"Python"}],diagram:{nodes:["Raw Data \uD83D\uDCE6","Cleaning \uD83E\uDDF9","Analysis \uD83D\uDCCA","Prediction \uD83D\uDD2E","Decision ✅"],layout:"vertical"},table:{headers:["Type","Meaning","Example"],rows:[["Descriptive","What happened?","Sales last month"],["Predictive","What will happen?","Sales next month"],["Prescriptive","What to do?","Give discount"]]},remember:["Data Science = Stats + Coding + Domain","3 Pillars: Statistics, Programming, Domain","3 Analytics: Descriptive, Predictive, Prescriptive","Tools: Python, R, SQL","Lifecycle: Data → Clean → Model → Decision"],mnemonic:{code:"SPD",lines:["S - Statistics","P - Programming","D - Domain Knowledge"],tip:"Remember SPD = Speed = Fast decisions"},mistakes:[{wrong:"Data Science = Only coding",right:"It needs Statistics + Domain also"},{wrong:"More data always better",right:"Quality data is better than quantity"},{wrong:"Excel is enough for all",right:"Need Python/R for large data"}],keywords:["Raw Data","Model","Prediction","Statistics","Domain","Descriptive","Predictive","Prescriptive","Python","Analytics"],twoMark:["Define Data Science in simple words.","What are 3 pillars of Data Science?","Difference between Descriptive and Predictive?","Name 3 tools of Data Science.","Who is a Data Scientist?"],fiveMark:["Explain Data Science lifecycle with diagram.","Explain types of analytics with examples.","What is role of Statistics, Programming, Domain in Data Science?"],revision:["Data \uD83D\uDCE6","→","Stats + Code + Domain \uD83C\uDFDB️","→","Descriptive \uD83D\uDCCA","→","Predictive \uD83D\uDD2E","→","Prescriptive \uD83E\uDDED","→","Decision ✅"]},{id:2,slug:"benefits-uses",title:"Benefits and Uses of Data Science",icon:"\uD83D\uDE80",defLines:["Data Science gives many benefits to companies and people.","It makes work fast and accurate without human error.","It saves time and money for business.","It gives personal service to every customer.","It helps to grow business quickly and safely."],example:"Amazon shows you products you like to buy based on your past search. This increases sales.",why:["Better Decisions - data proof not guess","Automation - work without humans","Cost Saving - removes waste","Personalization - each user special","Risk Detection - finds fraud early"],subtopics:[{icon:"\uD83C\uDFAF",heading:"Better Decision Making",def:"Decisions based on data, not guess. 100% proven with numbers.",example:"Shop opens based on footfall data.",keyword:"Evidence"},{icon:"\uD83E\uDD16",heading:"Automation",def:"Machines do repeated work auto. No need human every time.",example:"Chatbot answers 1000 customers.",keyword:"Auto Work"},{icon:"\uD83D\uDD2E",heading:"Future Prediction",def:"Predict sales, demand, failure before it happens. Plan early.",example:"Predict stock will finish tomorrow.",keyword:"Forecast"},{icon:"\uD83C\uDF81",heading:"Personalization",def:"Show different thing to different user. User feels special.",example:"Spotify playlist made for you.",keyword:"Personal"},{icon:"\uD83D\uDCB0",heading:"Cost Saving",def:"Find where money is wasted. Save lakhs of rupees.",example:"Delivery route optimized saves fuel.",keyword:"Save Money"},{icon:"\uD83D\uDEE1️",heading:"Fraud Detection",def:"Find fraud transaction in seconds. Protect bank and user.",example:"Bank blocks suspicious payment.",keyword:"Security"},{icon:"\uD83D\uDCA1",heading:"Innovation",def:"Discover new product ideas from data patterns.",example:"New flavor launched after data study.",keyword:"New Ideas"},{icon:"\uD83C\uDFC6",heading:"Competitive Advantage",def:"Company stays ahead of competitors using data insights.",example:"Zomato vs Swiggy data war.",keyword:"Advantage"}],diagram:{nodes:["Business Problem \uD83E\uDD14","Data Science \uD83D\uDD2C","Smart Solution \uD83D\uDCA1","Profit \uD83D\uDCC8"],layout:"vertical"},table:{headers:["Benefit","How it Helps","Example"],rows:[["Decision","Correct choice","Manager dashboard"],["Personalization","Happy customer","Netflix suggest"],["Cost","Save money","Optimized route"]]},remember:["Benefits = BAPC FICB","Uses in 5 industries: Health, Bank, Shop, Transport, Education","Real examples = Amazon, Netflix, Bank fraud","Saves time + money","Main goal = profit + satisfaction"],mnemonic:{code:"BAPC-FICB",lines:["B-Better Decision","A-Automation","P-Prediction","C-Cost Saving","F-Fraud Detection","I-Innovation","C-Competitive Advantage","B-Benefits"],tip:"Remember as 'BAPU FIC Batch'"},mistakes:[{wrong:"Benefits only for big companies",right:"Small shops also benefit"},{wrong:"Data Science only predicts",right:"It also automates and personalizes"},{wrong:"Personalization = Spam",right:"Personalization = Helpful suggestion"}],keywords:["Automation","Personalization","Prediction","Fraud Detection","ROI","Competitive Advantage","Innovation","Cost Saving"],twoMark:["List 5 benefits of Data Science.","How does Amazon use Data Science?","What is Personalization?","Define Fraud Detection.","How Data Science saves cost?"],fiveMark:["Explain benefits of Data Science with examples.","Explain uses of Data Science in 4 industries.","How Data Science gives competitive advantage?"],revision:["Problem \uD83E\uDD14 → Data Science \uD83D\uDD2C → Automation \uD83E\uDD16 + Personal \uD83C\uDF81 + Prediction \uD83D\uDD2E → Profit \uD83D\uDCC8"]},{id:3,slug:"facets-of-data",title:"Facets of Data",icon:"\uD83D\uDC8E",defLines:["Facets means different faces or types of data.","Data comes in many shapes like table, photo, video.","Some data is neat in rows, some is messy.","Knowing type helps choose correct tool.","It is first step before doing data science."],example:"Student Excel file is Structured Data. Instagram photo is Unstructured Data. Both need different tools.",why:["Choose right tool for right data type","Store correctly - SQL or NoSQL","Process faster if type known","Understand data better","Avoid mistakes in analysis"],subtopics:[{icon:"\uD83D\uDDC2️",heading:"Structured Data",def:"Neat data in rows and columns. Easy to search. Stored in SQL.",example:"Excel marks sheet, Bank database.",keyword:"Rows & Columns"},{icon:"\uD83D\uDDBC️",heading:"Unstructured Data",def:"Messy data no fixed format. Like photos, videos, audio, tweets.",example:"Instagram photos, YouTube videos.",keyword:"No Format"},{icon:"\uD83E\uDDE9",heading:"Semi-Structured Data",def:"Mix of both. Has tags but not full table. Like JSON, XML.",example:"Email has tags but body is free text.",keyword:"JSON"},{icon:"⏰",heading:"Temporal Data",def:"Data with time stamp. Changes with time. Time matters.",example:"Stock price every minute.",keyword:"Time Series"},{icon:"\uD83D\uDDFA️",heading:"Spatial Data",def:"Data with location. Latitude longitude. Map data.",example:"Google Maps location data.",keyword:"Location"},{icon:"\uD83C\uDF0A",heading:"Streaming Data",def:"Continuous flow of data coming fast. Real-time.",example:"Sensor data, Live CCTV feed.",keyword:"Real-time"},{icon:"\uD83C\uDF0D",heading:"Open Data",def:"Free data available for all. Government releases many.",example:"Weather data, Govt census.",keyword:"Free Data"},{icon:"\uD83D\uDD73️",heading:"Dark Data",def:"Data company collects but never uses. Hidden gold.",example:"Old server logs not analyzed.",keyword:"Unused"}],diagram:{nodes:["Facets \uD83D\uDC8E"],layout:"hub",hubLabel:"Types of Data"},table:{headers:["Type","Format","Example","Tool"],rows:[["Structured","Table","SQL table","MySQL"],["Unstructured","Media","Photo","Hadoop"],["Semi-Structured","JSON/XML","Email","MongoDB"],["Temporal","Time + Value","Stock","TimeDB"]]},remember:["Structured = Table","Unstructured = Photo/Video","Semi = JSON/XML","4 special: Temporal, Spatial, Streaming, Dark","Tools depend on type"],mnemonic:{code:"SUS TSS OD",lines:["S-Structured","U-Unstructured","S-Semi-Structured","T-Temporal","S-Spatial","S-Streaming","O-Open","D-Dark"],tip:"Think 'SUS' like suspicious data + TSS OD"},mistakes:[{wrong:"All data is Excel",right:"80% data is unstructured"},{wrong:"JSON is structured",right:"JSON is semi-structured"},{wrong:"Dark data is bad data",right:"Dark data is unused data"}],keywords:["Structured","Unstructured","Semi-Structured","Temporal","Spatial","Streaming","JSON","XML","SQL"],twoMark:["Define facets of data.","Difference between Structured and Unstructured.","What is Semi-Structured data?","Give example of Temporal data.","What is Dark Data?"],fiveMark:["Explain 8 facets of data with examples.","Compare Structured vs Unstructured vs Semi-Structured.","Why knowing data facet is important?"],revision:["Facets \uD83D\uDC8E = Structured \uD83D\uDDC2️ | Unstructured \uD83D\uDDBC️ | Semi \uD83E\uDDE9 | Temporal ⏰ | Spatial \uD83D\uDDFA️ | Streaming \uD83C\uDF0A | Open \uD83C\uDF0D | Dark \uD83D\uDD73️"]},{id:4,slug:"process-overview",title:"Data Science Process Overview",icon:"\uD83D\uDD04",defLines:["Process is step-by-step method to solve problem.","Like recipe to cook food, must follow order.","It has 6 to 8 main steps from start to end.","If you skip any step, final result will be wrong.","It helps get correct answer from raw data."],example:"Making sales dashboard: First fix goal, then collect data, clean it, explore, build model, show dashboard.",why:["Systematic - no confusion","No step missed - quality result","Saves time - clear order","Repeatable - others can follow","Quality - correct output"],subtopics:[{icon:"\uD83C\uDFAF",heading:"Defining Goals",def:"Fix what you want to achieve. Clear goal = success.",example:"Goal: Increase sales by 15%",keyword:"Goal"},{icon:"\uD83D\uDCE5",heading:"Retrieving Data",def:"Collect data from different places. Internal + external.",example:"Sales Excel + weather API",keyword:"Collect"},{icon:"\uD83E\uDDF9",heading:"Data Preparation",def:"Clean dirty data. Most time taken here 70%.",example:"Remove wrong age 200",keyword:"Cleaning"},{icon:"\uD83D\uDD0D",heading:"EDA",def:"Explore data with graphs. Find patterns, outliers.",example:"Chart shows Dec sales high",keyword:"Explore"},{icon:"\uD83E\uDDE0",heading:"Building Model",def:"Teach computer to learn. Train and test model.",example:"Teach spam detection",keyword:"Model"},{icon:"✅",heading:"Evaluation",def:"Check if model is good. Accuracy, precision.",example:"Model accuracy 92%",keyword:"Accuracy"},{icon:"\uD83D\uDE80",heading:"Deployment",def:"Make model live for users. App or dashboard.",example:"Dashboard for manager",keyword:"Deploy"},{icon:"♻️",heading:"Feedback & Maintenance",def:"Take feedback and improve. Process is circular.",example:"Update model monthly",keyword:"Feedback"}],diagram:{nodes:["Goals \uD83C\uDFAF","Retrieve \uD83D\uDCE5","Prepare \uD83E\uDDF9","Explore \uD83D\uDD0D","Model \uD83E\uDDE0","Evaluate ✅","Deploy \uD83D\uDE80","Feedback ♻️"],layout:"circular"},table:{headers:["Step","Work","Time %"],rows:[["Define Goal","Fix objective","5%"],["Retrieve","Collect data","10%"],["Preparation","Cleaning","70%"],["EDA + Model","Build & test","15%"]]},remember:["Mnemonic GRPEMEDF","Cleaning takes 70% time","Process is circular not linear","Goal is first, Feedback is last","Evaluation before Deployment"],mnemonic:{code:"GRPEMEDF",lines:["G-Goals","R-Retrieve","P-Prepare","E-Explore","M-Model","E-Evaluate","D-Deploy","F-Feedback"],tip:"Remember 'Great People Make Every Day Fun'"},mistakes:[{wrong:"Start with coding directly",right:"Start with Goals first"},{wrong:"Process is one-time",right:"It is circular, needs feedback"},{wrong:"EDA not needed",right:"EDA is must before model"}],keywords:["Process","Goals","Retrieve","Prepare","EDA","Model","Evaluate","Deploy","Feedback","Lifecycle"],twoMark:["What is Data Science Process?","Why preparation takes 70%?","What is Deployment?","What is GRPEMEDF?","Is process linear or circular?"],fiveMark:["Explain Data Science Process with diagram.","Why Defining Goals is most important step?","Explain time distribution in Data Science process."],revision:["Goal \uD83C\uDFAF → Retrieve \uD83D\uDCE5 → Prepare \uD83E\uDDF9(70%) → Explore \uD83D\uDD0D → Model \uD83E\uDDE0 → Evaluate ✅ → Deploy \uD83D\uDE80 → Feedback ♻️ → Loop"]},{id:5,slug:"research-goals",title:"Defining Research Goals",icon:"\uD83C\uDFAF",defLines:["First and most important step of project.","If goal is wrong, whole project will fail.","Must write what we want clearly in simple words.","Goal must be measurable with numbers and time.","It connects business problem to data solution."],example:"Bad Goal: Increase sales. Good Goal: Increase shop sales by 15% in 3 months using offers data.",why:["Gives clear direction to team","Saves time - no wandering","Measures success with numbers","Avoids confusion between teams","Aligns business + tech team"],subtopics:[{icon:"\uD83C\uDFE2",heading:"Understand Business Problem",def:"Talk to business people. Understand pain point deeply.",example:"Why sales dropping?",keyword:"Pain Point"},{icon:"❓",heading:"Ask Right Questions",def:"Ask 5W1H: What, Why, Where, When, Who, How.",example:"What product sales low?",keyword:"5W1H"},{icon:"⭐",heading:"Set SMART Objectives",def:"Specific, Measurable, Achievable, Relevant, Time-bound.",example:"15% in 3 months",keyword:"SMART"},{icon:"\uD83D\uDCCF",heading:"Define Metrics",def:"How to measure success? KPI like accuracy, sales.",example:"Accuracy >90%",keyword:"KPI"},{icon:"\uD83D\uDCC4",heading:"Create Project Charter",def:"One page doc with goal, scope, team, timeline.",example:"Project start document",keyword:"Charter"},{icon:"\uD83D\uDC65",heading:"Identify Stakeholders",def:"Who cares about project? Manager, client, user.",example:"Sales head is stakeholder",keyword:"Stakeholder"},{icon:"\uD83D\uDD0D",heading:"Feasibility Check",def:"Can we do? Do we have data, money, time?",example:"Do we have 1 year data?",keyword:"Feasibility"},{icon:"\uD83C\uDF81",heading:"Define Deliverables",def:"What final output? Dashboard, app, report?",example:"Sales dashboard in PowerBI",keyword:"Deliverable"}],diagram:{nodes:["Business Pain \uD83C\uDFE2","Data Question ❓","SMART Goal ⭐","Metrics \uD83D\uDCCF"],layout:"vertical"},table:{headers:["Bad Goal","Good Goal (SMART)"],rows:[["Increase sales","Increase sales 15% in 3 months in Chennai branch"],["Make model","Build churn model with 90% accuracy by Dec"]]},remember:["SMART = Specific Measurable Achievable Relevant Time-bound","First step = Most important","Stakeholders must agree goal","Define metrics before start","Deliverables = Final output"],mnemonic:{code:"UASD CIFD",lines:["U-Understand Problem","A-Ask Questions","S-SMART","D-Define Metrics","C-Charter","I-Identify Stakeholders","F-Feasibility","D-Deliverables"],tip:"Read as 'You Asked Smart Dude, Can I Find Delivery'"},mistakes:[{wrong:"Goal = 'Do data science'",right:"Goal must be business outcome"},{wrong:"Goal without numbers",right:"Must have numbers + time"},{wrong:"Ignore stakeholders",right:"Take approval from all"}],keywords:["Research Goal","SMART","KPI","Stakeholder","Feasibility","Charter","Deliverable","Metrics","Business Problem"],twoMark:["Define Research Goal.","What is SMART?","Who is Stakeholder?","What is KPI?","What is Project Charter?"],fiveMark:["Explain SMART goals with example.","Why defining goals is important? Explain with bad vs good goal.","Explain steps in defining research goals."],revision:["Business Pain \uD83C\uDFE2 → Question ❓ → SMART ⭐(Specific Measurable Achievable Relevant Time) → Metrics \uD83D\uDCCF → Deliverable \uD83C\uDF81"]},{id:6,slug:"retrieving-data",title:"Retrieving Data",icon:"\uD83D\uDCE5",defLines:["Retrieving means finding and collecting needed data.","Without data, no data science project can start.","Data can be inside company or outside internet.","Must know where correct data is present.","Good data leads to good model, bad data fails."],example:"Collecting shop sales from Excel (internal) + weather from API (external) to predict sales.",why:["Foundation of project - no data no model","Quality matters - GIGO","Different sources give full picture","Right data saves time later","Legal compliance - take permission"],subtopics:[{icon:"\uD83C\uDFE2",heading:"Internal Sources",def:"Data inside company. ERP, CRM, database, Excel.",example:"Sales records, HR data",keyword:"Company Data"},{icon:"\uD83C\uDF10",heading:"External Sources",def:"Data outside company. Govt, market, social media.",example:"Weather, census, market price",keyword:"Outside Data"},{icon:"\uD83D\uDD0C",heading:"APIs",def:"APIs give live data from other websites directly.",example:"Weather API, Google Maps API",keyword:"API"},{icon:"\uD83D\uDD77️",heading:"Web Scraping",def:"Extract data from websites using code. Auto collect.",example:"Scrape product prices from Amazon",keyword:"Scraping"},{icon:"\uD83D\uDCDD",heading:"Surveys",def:"Ask questions to people. Get direct feedback data.",example:"Google Form for customer liking",keyword:"Feedback"},{icon:"\uD83D\uDCE1",heading:"Sensors & IoT",def:"Machines generate data automatically every second.",example:"Temperature sensor, CCTV",keyword:"IoT"},{icon:"\uD83D\uDCC2",heading:"Data Formats",def:"CSV, JSON, SQL, Excel, Parquet. Different formats.",example:"CSV = comma values",keyword:"CSV JSON"},{icon:"⚠️",heading:"Access Challenges",def:"Privacy, permission, cost, big size problems.",example:"GDPR privacy rule",keyword:"Privacy"}],diagram:{nodes:["Internal \uD83C\uDFE2","External \uD83C\uDF10","API \uD83D\uDD0C","Survey \uD83D\uDCDD","Sensors \uD83D\uDCE1"],layout:"hub",hubLabel:"Central Collection"},table:{headers:["Source","Example","Method"],rows:[["Internal","Sales DB","SQL query"],["External","Weather","API call"],["Survey","Feedback","Google Form"],["Sensor","Temperature","IoT device"]]},remember:["Internal + External","CSV, JSON, SQL main formats","API = live data","Scraping = auto extract","Check privacy & permission"],mnemonic:{code:"IEAW SSFD",lines:["I-Internal","E-External","A-API","W-Web Scraping","S-Survey","S-Sensors","F-Formats","D-Data Challenges"],tip:"Read as 'I Earn And Work Smartly For Future Dreams'"},mistakes:[{wrong:"Take data without permission",right:"Always take permission, GDPR"},{wrong:"Only one source enough",right:"Multiple sources give better result"},{wrong:"CSV and JSON same",right:"CSV=table, JSON=tags format"}],keywords:["Retrieve","Internal","External","API","Web Scraping","CSV","JSON","SQL","IoT","Privacy"],twoMark:["What is Data Retrieval?","Difference between Internal and External sources?","What is API?","Name 3 data formats.","What is Web Scraping?"],fiveMark:["Explain different sources of data with examples.","Explain challenges in data retrieval.","What are different data formats? Explain."],revision:["Sources \uD83C\uDFE2\uD83C\uDF10 + API \uD83D\uDD0C + Scraping \uD83D\uDD77️ + Survey \uD83D\uDCDD + Sensors \uD83D\uDCE1 → Formats \uD83D\uDCC2(CSV/JSON/SQL) → Central DB \uD83D\uDDC4️"]},{id:7,slug:"data-preparation",title:"Data Preparation",icon:"\uD83E\uDDF9",defLines:["Real data is dirty and not ready to use.","Preparation means cleaning and making useful.","It takes 70% of total project time.","If dirty data used, result will be wrong.","Most important step for success of model."],example:"Age = 200 years is wrong, remove it. Marks missing, fill with average 65.",why:["Removes errors and wrong values","Improves accuracy of model","Makes model fast - less junk","Handles missing values","Converts to correct format"],subtopics:[{icon:"✨",heading:"Data Cleaning",def:"Remove wrong, duplicate, irrelevant data. Make clean.",example:"Remove duplicate rows",keyword:"Clean"},{icon:"❓",heading:"Handling Missing Values",def:"Some cells empty. Fill with mean or delete row.",example:"Fill missing age with average",keyword:"Missing"},{icon:"\uD83D\uDD17",heading:"Data Integration",def:"Combine data from many sources into one.",example:"Sales + customer + product joined",keyword:"Combine"},{icon:"\uD83D\uDD04",heading:"Data Transformation",def:"Change format, scale. Normalize numbers 0-1.",example:"Age 0-100 to 0-1 scale",keyword:"Transform"},{icon:"\uD83D\uDCC9",heading:"Data Reduction",def:"Reduce size but keep important info. Less columns.",example:"Keep only 10 important columns from 100",keyword:"Reduce"},{icon:"\uD83D\uDCE6",heading:"Data Discretization",def:"Convert continuous to categories. Age -> Child/Young/Old.",example:"Marks 90-100 = A grade",keyword:"Categories"},{icon:"\uD83D\uDEA8",heading:"Outlier Handling",def:"Outlier = very different value. Remove or fix it.",example:"Salary 10 crores in 10k data",keyword:"Outlier"},{icon:"✅",heading:"Data Validation",def:"Check if data correct after cleaning. Final check.",example:"Age must be 0-100 only",keyword:"Validate"}],diagram:{nodes:["Raw Dirty \uD83D\uDDD1️","Cleaning ✨","Integration \uD83D\uDD17","Transformation \uD83D\uDD04","Reduction \uD83D\uDCC9","Clean Ready ✅"],layout:"vertical"},table:{headers:["Problem","Solution","Example"],rows:[["Missing value","Fill mean","Age blank -> 35"],["Duplicate","Remove dup","Same row twice"],["Wrong format","Transform","Age text to number"],["Outlier","Remove/fix","Age 200 removed"]]},remember:["GIGO = Garbage In Garbage Out","70% time in preparation","Steps: CITTRDOV","Missing = mean/median","Outlier must be handled"],mnemonic:{code:"CHITRODV",lines:["C-Cleaning","H-Handling Missing","I-Integration","T-Transformation","R-Reduction","O-Outlier","D-Discretization","V-Validation"],tip:"CHITRO = Chitra prepares food cleanly"},mistakes:[{wrong:"Skip cleaning, direct model",right:"Cleaning is must, 70% time"},{wrong:"Delete all missing rows",right:"Try filling with mean first"},{wrong:"Outliers are always wrong",right:"Some outliers are important"}],keywords:["Data Preparation","Cleaning","Missing Values","Integration","Transformation","Reduction","Outlier","Validation","GIGO"],twoMark:["Define Data Preparation.","What is GIGO?","Why 70% time in preparation?","What is Outlier?","What is Data Integration?"],fiveMark:["Explain steps in Data Preparation with diagram.","How to handle missing values? Explain methods.","What is Data Cleaning and Transformation?"],revision:["Dirty \uD83D\uDDD1️ → Clean ✨ → Fill Missing ❓ → Combine \uD83D\uDD17 → Transform \uD83D\uDD04 → Reduce \uD83D\uDCC9 → Remove Outlier \uD83D\uDEA8 → Ready ✅"]},{id:8,slug:"eda",title:"Exploratory Data Analysis (EDA)",icon:"\uD83D\uDD0D",defLines:["EDA means exploring data deeply before model.","Like seeing map before starting journey.","Use graphs and numbers to understand data.","Find patterns, relations, hidden mistakes.","Helps choose correct model later."],example:"Bar chart shows December sales highest, June lowest. This pattern found via EDA.",why:["Understands data clearly","Finds patterns and trends","Detects outliers early","Chooses right model","Improves quality of model"],subtopics:[{icon:"\uD83D\uDD22",heading:"Descriptive Statistics",def:"Mean, median, mode, min, max. Numbers that summarize.",example:"Mean marks 65, Max 95",keyword:"Summary Stats"},{icon:"\uD83D\uDCCA",heading:"Data Visualization",def:"Charts and graphs to see data. Bar, pie, line, scatter.",example:"Bar chart of sales",keyword:"Charts"},{icon:"\uD83D\uDD17",heading:"Correlation Analysis",def:"Check relation between two columns. Positive or negative.",example:"More study = more marks",keyword:"Relation"},{icon:"\uD83D\uDEA8",heading:"Outlier Detection",def:"Find weird values using boxplot. Fix them.",example:"One student age 60 in class 20",keyword:"Outlier"},{icon:"\uD83C\uDF00",heading:"Pattern Recognition",def:"Find repeating behavior or trend in data.",example:"Sales high on weekends",keyword:"Pattern"},{icon:"\uD83E\uDDEA",heading:"Hypothesis Testing",def:"Test if assumption true or false with data.",example:"Does offer increase sales?",keyword:"Test"},{icon:"⭐",heading:"Feature Importance",def:"Which column most important for prediction.",example:"Price more important than color",keyword:"Important Feature"},{icon:"\uD83D\uDCC8",heading:"Distribution Analysis",def:"How data spread? Normal or skewed? Use histogram.",example:"Marks bell curve",keyword:"Distribution"}],diagram:{nodes:["Clean Data ✨","Stats \uD83D\uDD22","Graphs \uD83D\uDCCA","Patterns \uD83C\uDF00","Insights \uD83D\uDCA1"],layout:"vertical"},table:{headers:["Method","Work","Graph/Tool"],rows:[["Visualization","See trend","Bar, Line, Pie"],["Correlation","Relation","Heatmap"],["Outlier","Weird values","Boxplot"],["Distribution","Spread check","Histogram"]]},remember:["Graphs + Numbers = EDA","Tools: Python Matplotlib, Seaborn","Find outliers via boxplot","Correlation via heatmap","EDA before Model always"],mnemonic:{code:"DVCOPHFD",lines:["D-Descriptive Stats","V-Visualization","C-Correlation","O-Outlier","P-Pattern","H-Hypothesis","F-Feature Importance","D-Distribution"],tip:"Don't Visit College On Public Holidays For Dinner"},mistakes:[{wrong:"EDA after model",right:"EDA before model always"},{wrong:"Only numbers, no graphs",right:"Both numbers + graphs needed"},{wrong:"Ignore outliers",right:"Must find and handle outliers"}],keywords:["EDA","Visualization","Correlation","Outlier","Histogram","Boxplot","Heatmap","Distribution","Pattern"],twoMark:["Define EDA.","Name 3 graphs used in EDA.","What is Correlation?","What is Outlier detection?","Name EDA tools."],fiveMark:["Explain EDA steps with diagrams.","What is Data Visualization? Types of charts?","Explain Correlation and Distribution analysis."],revision:["Clean ✨ → Stats \uD83D\uDD22(Mean/Median) → Graphs \uD83D\uDCCA(Bar/Pie/Hist) → Correlation \uD83D\uDD17 → Pattern \uD83C\uDF00 → Insight \uD83D\uDCA1 → Choose Model \uD83E\uDDE0"]},{id:9,slug:"building-model",title:"Building the Model",icon:"\uD83E\uDDE0",defLines:["Building model means teaching computer to learn.","Model is trained brain that predicts future.","Uses Machine Learning algorithms to learn.","Train with past data, test with new data.","Best model gives highest accuracy score."],example:"Model learns 1000 spam emails, then predicts new email spam or not spam with 95% accuracy.",why:["Gives prediction for future","Automates decision - no human needed","Learns from past experience","Improves with more data","Core of AI - heart of system"],subtopics:[{icon:"\uD83C\uDFAF",heading:"Selecting Model Type",def:"Choose model based on problem. Classification or regression.",example:"Spam = Classification",keyword:"Model Type"},{icon:"\uD83C\uDFCB️",heading:"Training (80%)",def:"Teach model with 80% data. Like teaching student.",example:"800 rows for training",keyword:"Train 80%"},{icon:"\uD83E\uDDEA",heading:"Testing (20%)",def:"Test model with unseen 20% data. Check accuracy.",example:"200 rows for testing",keyword:"Test 20%"},{icon:"\uD83D\uDCCF",heading:"Model Evaluation",def:"Measure accuracy, precision, recall, F1 score.",example:"Accuracy 92% good",keyword:"Accuracy"},{icon:"\uD83D\uDD27",heading:"Model Tuning",def:"Adjust settings to improve accuracy. Hyperparameter tuning.",example:"Change learning rate",keyword:"Tuning"},{icon:"\uD83C\uDFC6",heading:"Model Selection",def:"Compare many models, pick best one with highest score.",example:"Random Forest better than Logistic",keyword:"Best Model"},{icon:"⚖️",heading:"Overfitting vs Underfitting",def:"Overfit = mugs up, Underfit = learns less. Need balance.",example:"Student mugs book vs not study",keyword:"Overfit"},{icon:"\uD83D\uDD04",heading:"Cross Validation",def:"Split data many times to test properly. K-Fold.",example:"5-fold cross validation",keyword:"K-Fold"}],diagram:{nodes:["Training 80% \uD83C\uDFCB️","Learns \uD83E\uDDE0","Testing 20% \uD83E\uDDEA","Accuracy \uD83D\uDCCF","Final Model \uD83C\uDFC6"],layout:"vertical"},table:{headers:["Problem Type","Model","Use Case"],rows:[["Classification","Logistic, Random Forest","Spam detection"],["Regression","Linear Regression","Price prediction"],["Clustering","K-Means","Customer groups"]]},remember:["80/20 rule = Train 80% Test 20%","Underfitting vs Overfitting balance","Accuracy = Correct/Total","Tuning improves model","Cross validation = better testing"],mnemonic:{code:"STTEM SOC",lines:["S-Select Type","T-Training","T-Testing","E-Evaluation","M-Tuning","S-Selection","O-Overfit/Underfit","C-Cross Validation"],tip:"STEM SOC = Science Tech Engineering Math Society"},mistakes:[{wrong:"Train with 100% data",right:"Always keep 20% for testing"},{wrong:"Higher accuracy always best",right:"Check overfitting also"},{wrong:"One model enough",right:"Try multiple models and compare"}],keywords:["Model","Training","Testing","Accuracy","Precision","Overfitting","Underfitting","Cross Validation","Tuning","80/20"],twoMark:["Define Model Building.","What is 80/20 rule?","Define Overfitting.","What is Cross Validation?","What is Model Evaluation?"],fiveMark:["Explain train-test split and evaluation.","Explain Overfitting vs Underfitting with example.","Explain steps in building a model."],revision:["Data → Select Type \uD83C\uDFAF → Train 80% \uD83C\uDFCB️ → Test 20% \uD83E\uDDEA → Evaluate \uD83D\uDCCF → Tune \uD83D\uDD27 → Select Best \uD83C\uDFC6 → Final Model \uD83E\uDDE0"]},{id:10,slug:"presenting-findings",title:"Presenting Findings and Building Applications",icon:"\uD83D\uDCE2",defLines:["After model ready, must show results simply.","Business people don't understand code and maths.","Use dashboards and simple words to explain.","Then make app for regular use by company.","This step gives value to business and profit."],example:"Sales dashboard in Power BI shows which product sells more. Manager understands in 1 minute.",why:["Business understands result","Quick decisions by managers","Converts project to product","Shows ROI to company","Gets feedback for improvement"],subtopics:[{icon:"\uD83D\uDCCA",heading:"Visualization & Dashboards",def:"Charts, graphs, dashboards to show insights simply.",example:"Power BI sales dashboard",keyword:"Dashboard"},{icon:"\uD83D\uDCD6",heading:"Storytelling with Data",def:"Tell story using data. Start, middle, end with insight.",example:"Sales fell because offer less",keyword:"Story"},{icon:"\uD83D\uDCC4",heading:"Report Generation",def:"Create PDF report with findings, charts, recommendations.",example:"Monthly report for CEO",keyword:"Report"},{icon:"\uD83D\uDE80",heading:"Deployment",def:"Make model live on server. Users can use it.",example:"Model on cloud AWS",keyword:"Live"},{icon:"\uD83D\uDCF1",heading:"Building App/Website",def:"Make app or website so anyone can use model.",example:"Loan approval app",keyword:"App"},{icon:"\uD83E\uDD16",heading:"Automation",def:"Auto run model daily without human. Schedule job.",example:"Daily sales report auto email",keyword:"Auto"},{icon:"\uD83D\uDC40",heading:"Monitoring & Maintenance",def:"Check if model working correct daily. Update if needed.",example:"Accuracy dropping alert",keyword:"Monitor"},{icon:"\uD83C\uDF93",heading:"User Training",def:"Teach users how to use dashboard/app. Training session.",example:"Training for sales team",keyword:"Training"}],diagram:{nodes:["Findings \uD83D\uDCC4","Visualize \uD83D\uDCCA","Report \uD83D\uDCD6","Deploy as App \uD83D\uDCF1","Feedback ♻️","Improve \uD83D\uDCC8"],layout:"vertical"},table:{headers:["Audience","Need","How to Show"],rows:[["Manager","Quick decision","Dashboard"],["CEO","ROI","One page report"],["Customer","Use product","Mobile app"]]},remember:["Know audience before presenting","Dashboard = best for managers","Deployment = making live","Feedback loop important","Storytelling makes data interesting"],mnemonic:{code:"VSRD AMMU",lines:["V-Visualization","S-Storytelling","R-Re %",keyword:"If-Then"},{icon:"\uD83D\uDCC8",heading:"Prediction/Regression",def:"Predict number value using past data.",example:"Predict house price",keyword:"Number Predict"},{icon:"\uD83D\uDEA8",heading:"Anomaly Detection",def:"Find unusual or rare events. Fraud detection.",example:"Credit card fraud transaction",keyword:"Unusual"},{icon:"⏩",heading:"Sequential Pattern Mining",def:"Find sequence patterns over time. What next?",example:"Buy phone -> buy cover -> buy charger",keyword:"Sequence"},{icon:"\uD83D\uDCDD",heading:"Summarization",def:"Make summary of big data in few lines.",example:"Summary of 1 lakh reviews",keyword:"Summary"},{icon:"\uD83D\uDCAC",heading:"Text Mining",def:"Mine useful info from text data. Reviews, tweets.",example:"Find sentiment from tweets",keyword:"Text"}],diagram:{nodes:["Large DB \uD83D\uDDC4️","Select \uD83C\uDFAF","Clean \uD83E\uDDF9","Mining Algorithms ⛏️","Patterns \uD83D\uDC8E","Knowledge \uD83E\uDDE0"],layout:"vertical"},table:{headers:["Task","Type","Example"],rows:[["Classification","Supervised","Spam detection"],["Clustering","Unsupervised","Customer groups"],["Association","Rule","Market basket"],["Anomaly","Detection","Fraud"]]},remember:["CCAPASTT = 8 tasks","KDD process = Knowledge Discovery in Databases","Supervised = labels given","Unsupervised = no labels","Association = Market Basket"],mnemonic:{code:"CCAPASTT",lines:["C-Classification","C-Clustering","A-Association","P-Prediction","A-Anomaly","S-Sequential","T-Text","T-Summarization"],tip:"Read as 'C CAPA STT'"},mistakes:[{wrong:"Data Mining = Data Warehousing",right:"Mining finds patterns, Warehouse stores data"},{wrong:"Classification = Clustering",right:"Classification has labels, Clustering no labels"},{wrong:"Mining only for big data",right:"Mining works for any size data"}],keywords:["Data Mining","Classification","Clustering","Association","KDD","Supervised","Unsupervised","Pattern","Knowledge Discovery"],twoMark:["Define Data Mining.","What is KDD?","Difference between Classification and Clustering?","What is Association Rule?","What is Anomaly Detection?"],fiveMark:["Explain Data Mining tasks with examples.","Explain KDD process with diagram.","Difference between Supervised and Unsupervised mining."],revision:["DB \uD83D\uDDC4️ → Select \uD83C\uDFAF → Clean \uD83E\uDDF9 → Mine ⛏️(Classification \uD83C\uDFF7️, Clustering \uD83D\uDC65, Association \uD83D\uDED2, Anomaly \uD83D\uDEA8) → Patterns \uD83D\uDC8E → Knowledge \uD83E\uDDE0"]},{id:12,slug:"data-warehousing",title:"Data Warehousing",icon:"\uD83C\uDFE6",defLines:["Warehouse is big central place to store all data.","Different departments data stored together in one place.","Stores historical data for many years safely.","Data is cleaned before storing in warehouse.","Helps managers take decisions with full company view."],example:"All bank branches data (Chennai, Mumbai, Delhi) stored in one central warehouse for CEO report.",why:["Central storage - one place for all","Historical analysis - 5 years data","Faster reports - pre-cleaned data","Better decisions - full view","Supports mining and BI"],subtopics:[{icon:"\uD83C\uDFAF",heading:"Subject Oriented",def:"Organized around subjects like sales, customer, product.",example:"Sales subject has all sales data",keyword:"Subject"},{icon:"\uD83D\uDD17",heading:"Integrated",def:"Combine data from many sources into one format.",example:"Male/Female/M -> M/F",keyword:"Combined"},{icon:"⏳",heading:"Time Variant",def:"Keeps history of data. Time stamped. Many years.",example:"Sales 2020,2021,2022,2023",keyword:"History"},{icon:"\uD83D\uDD12",heading:"Non-Volatile",def:"Data once stored not changed. Only read. Stable.",example:"Old records not deleted",keyword:"Stable"},{icon:"⚙️",heading:"ETL Process",def:"Extract, Transform, Load. Bring data to warehouse.",example:"Extract from SQL -> Transform -> Load to warehouse",keyword:"ETL"},{icon:"\uD83D\uDCCA",heading:"OLAP",def:"Online Analytical Processing. Fast analysis of big data.",example:"Drill down, Slice dice operations",keyword:"OLAP"},{icon:"\uD83C\uDFEA",heading:"Data Marts",def:"Small warehouse for one department only. Subset.",example:"Sales Data Mart only",keyword:"Small Warehouse"},{icon:"\uD83C\uDFF7️",heading:"Metadata",def:"Data about data. Describes what data means.",example:"Column sales = total sales in rupees",keyword:"About Data"}],diagram:{nodes:["Sales \uD83C\uDFEA","HR \uD83D\uDC65","Excel \uD83D\uDCD7","ETL ⚙️","Warehouse \uD83C\uDFE6","Reports \uD83D\uDCCA"],layout:"vertical"},table:{headers:["Database vs","Data Warehouse"],rows:[["OLTP - Daily operations","OLAP - Analysis"],["Current data only","Historical 5-10 years"],["Fast writes","Fast reads"],["Small size GB","Huge size TB/PB"]]},remember:["4 characteristics SITN = Subject Integrated Time Non-Volatile","ETL = Extract Transform Load","OLTP vs OLAP","Data Mart = small warehouse","Metadata = data about data"],mnemonic:{code:"SITN EOMD",lines:["S-Subject Oriented","I-Integrated","T-Time Variant","N-Non-Volatile","E-ETL","O-OLAP","M-Data Marts","D-Metadata"],tip:"SITN = Sitting in warehouse"},mistakes:[{wrong:"Warehouse = Database",right:"Database=OLTP daily, Warehouse=OLAP analysis"},{wrong:"Warehouse has current data only",right:"Warehouse keeps many years history"},{wrong:"ETL = only Extraction",right:"ETL = Extract Transform Load full"}],keywords:["Data Warehouse","ETL","OLAP","OLTP","Data Mart","Metadata","Subject Oriented","Integrated","Non-Volatile"],twoMark:["Define Data Warehouse.","What is ETL?","What is OLAP?","Define Data Mart.","What is Metadata?"],fiveMark:["Explain 4 characteristics of Data Warehouse.","Explain ETL process with diagram.","Difference between Database and Data Warehouse."],revision:["Sources \uD83C\uDFEA\uD83D\uDC65\uD83D\uDCD7 → ETL ⚙️(Extract Transform Load) → Warehouse \uD83C\uDFE6(SITN) → Data Marts \uD83C\uDFEA → OLAP \uD83D\uDCCA → Reports/Dashboards"]},{id:13,slug:"stats-description",title:"Basic Statistical Description of Data",icon:"\uD83D\uDCCA",defLines:["Statistics is base of Data Science and very important.","Helps describe big data easily with few numbers.","Instead of lakhs of rows, few numbers summarize full data.","Tells average, spread, shape of data quickly.","Without stats cannot understand data. Like summary of movie."],example:"Average marks 65 tells class performance. No need to see all 100 students marks.",why:["Summarizes big data in few numbers","Shows center and spread","Compares two datasets easily","Finds outliers quickly","Supports correct decisions"],subtopics:[{icon:"\uD83C\uDFAF",heading:"Central Tendency",def:"Where is center of data? Mean, median, mode tell center.",example:"Center of marks is 65",keyword:"Center"},{icon:"➗",heading:"Mean",def:"Average of all numbers. Sum divided by count. Most common.",example:"Mean of 10,20,30 = 20",keyword:"Average"},{icon:"↕️",heading:"Median",def:"Middle value after sorting. Good if outliers present.",example:"Median of 1,2,100 = 2",keyword:"Middle"},{icon:"\uD83D\uDD01",heading:"Mode",def:"Most frequent value. Repeated most times in data.",example:"Mode of 1,2,2,3 = 2",keyword:"Frequent"},{icon:"↔️",heading:"Dispersion",def:"How spread out is data? Far or close to center?",example:"Marks spread from 30 to 95",keyword:"Spread"},{icon:"\uD83D\uDCCF",heading:"Range",def:"Max minus Min. Simplest spread measure.",example:"Range = 95-30=65",keyword:"Max-Min"},{icon:"\uD83D\uDCC9",heading:"Variance",def:"Average of squared differences from mean. Spread measure.",example:"Variance high = data spread more",keyword:"Squared Spread"},{icon:"\uD83D\uDCCA",heading:"Standard Deviation",def:"Square root of variance. Most useful spread measure.",example:"SD low = all marks near average",keyword:"SD"}],diagram:{nodes:["Data \uD83D\uDCE6","Center: Mean/Median/Mode \uD83C\uDFAF","Spread: Range/Variance/SD ↔️","Summary \uD83D\uDCCA"],layout:"vertical"},table:{headers:["Measure","What","When to Use"],rows:[["Mean","Average","Normal data no outl
